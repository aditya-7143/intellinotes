version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intellinotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intellinotes
      - JWT_SECRET=your-super-secret-key-change-in-production
      - LLM_PROVIDER=openrouter
      - EMBEDDING_PROVIDER=openrouter
      - EMBEDDING_MODEL=nvidia/nemotron-3-embed-1b:free
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/data/notes
      - CORS_ORIGINS=["http://localhost:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - notes_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  index-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intellinotes
      - EMBEDDING_PROVIDER=openrouter
      - EMBEDDING_MODEL=nvidia/nemotron-3-embed-1b:free
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/data/notes
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - notes_data:/app/data
    command: python -m app.infrastructure.rag.worker

  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  ollama_data:
  notes_data:
